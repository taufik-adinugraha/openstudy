[project]
name = "forest-watch"
version = "0.1.0"
description = "Case H pipeline: RADD/GLAD alerts clustered and linked to concessions, palm extent and mills"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.32",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=17",
    "duckdb>=1.1",
    "geopandas>=1.0",
    "shapely>=2.0",
    "pyogrio>=0.10",
    "rasterio>=1.3",
    "scipy>=1.14",        # ndimage.label for connected-component clustering
    "exactextract>=0.2",
    "pystac-client>=0.8",
    "pillow>=10.4",
]

[tool.uv]
package = false
