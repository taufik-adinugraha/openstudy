[project]
name = "fire-haze"
version = "0.1.0"
description = "Case J pipeline: fire-ignition risk and haze transport for Indonesia and the transboundary receptors"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.32",          # NOT urllib: header case is preserved (forest-watch lesson)
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=17",
    "duckdb>=1.1",
    "geopandas>=1.0",
    "shapely>=2.0",
    "pyogrio>=0.10",
    "rasterio>=1.3",
    "xarray>=2024.7",
    "netcdf4>=1.7",            # CDS/ERA5 returns NetCDF4 (and TWO files per multi-var request)
    "scipy>=1.14",
    "scikit-learn>=1.5",
    "lightgbm>=4.5",           # ignition-risk classifier (same family as air-quality's model)
    "exactextract>=0.2",
    "cdsapi>=0.7",             # ERA5 + CEMS fire indices (~/.cdsapirc already present)
    "pillow>=10.4",
]

[tool.uv]
package = false
