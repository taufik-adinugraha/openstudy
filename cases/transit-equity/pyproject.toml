[project]
name = "transit-equity"
version = "0.1.0"
description = "Case G pipeline: GTFS + OSM routing (r5py) → kelurahan access and equity metrics for Jabodetabek"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.32",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=17",
    "geopandas>=1.0",
    "shapely>=2.0",
    "pyogrio>=0.10",
    "rasterio>=1.3",
    "r5py>=1.0",          # needs a JDK 21 on PATH; downloads the R5 jar on first use
    "scipy>=1.14",
    # osmium is used as the CLI (osmium-tool), not pyosmium; duckdb/exactextract/gtfs-kit
    # dropped — the GTFS work is plain pandas and zonal stats are rasterize+bincount (util.py).
]

[tool.uv]
package = false
