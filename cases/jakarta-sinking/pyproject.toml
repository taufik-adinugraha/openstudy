    "pandas>=2.2",
    "pyarrow>=17",
    "geopandas>=1.0",
    "shapely>=2.0",
    "rasterio>=1.3",
    "scipy>=1.14",
    "exactextract>=0.2",
    "pillow>=10.4",
]

[tool.uv]
package = false
