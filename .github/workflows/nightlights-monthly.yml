# Flagship A monthly run. EOG publishes with ~1-2 month lag, so we probe on
# the 10th; ingest exits cleanly (NOT_PUBLISHED) if the month isn't up yet.
name: nightlights-monthly

on:
  schedule:
    - cron: "0 3 10 * *"   # 10th of each month, 03:00 UTC (10:00 WIB)
  workflow_dispatch:
    inputs:
      month:
        description: "Month to (re)run, YYYY-MM (default: two months ago)"
        required: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Resolve target month
        id: month
        run: |
          M="${{ github.event.inputs.month }}"
          [ -z "$M" ] && M=$(date -u -d "$(date -u +%Y-%m-01) -2 months" +%Y-%m)
          echo "m=$M" >> "$GITHUB_OUTPUT"
      - name: Run pipeline
        working-directory: cases/nightlights-pulse
        env:
          # Primary lights source is Black Marble via LAADS (D12).
          # NOTE: Earthdata tokens expire ~60 days — rotate this secret.
          EARTHDATA_TOKEN: ${{ secrets.EARTHDATA_TOKEN }}
          LAADS_APP_KEY: ${{ secrets.LAADS_APP_KEY }}
          BPS_API_KEY: ${{ secrets.BPS_API_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          uv sync
          make month M=${{ steps.month.outputs.m }}
          make validate
      # TODO week 3: brief-as-PR step — generate brief, open PR; merge = human
      # review (decision D11). Deploy only runs on merged brief.
